# Once a week, reads Artificial Analysis's latest numbers and updates the model picks on
# docs/models/ and docs/local-models/ (scripts/make-models.py --fetch), pushes them to main and asks
# GitHub Pages to publish them. It needs a free Artificial Analysis API key saved as the repository secret
# AA_API_KEY; without one it does nothing. The key is kept as a GitHub secret and sent only to
# Artificial Analysis. Nothing about the site's visitors is involved.
name: Refresh model picks

on:
  schedule:
    - cron: "23 13 * * 1"  # Mondays, 13:23 UTC
  workflow_dispatch:       # the Run workflow button, to refresh now

permissions: {}

concurrency:
  group: model-picks
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'  # it pushes to main, so it only runs from main
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main  # main as it is when the job starts, so a run that waited sees the last run's push

      - name: Read Artificial Analysis's numbers and make the picks
        id: fetch
        env:
          AA_API_KEY: ${{ secrets.AA_API_KEY }}
        run: |
          if [ -z "$AA_API_KEY" ]; then
            echo "::warning::No AA_API_KEY secret, so the picks weren't refreshed. Make a free key at artificialanalysis.ai and save it under Settings, Secrets and variables, Actions."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 scripts/make-models.py --fetch

      - name: Check the pages
        if: steps.fetch.outputs.skip != 'true'
        run: |
          python3 scripts/make-models.py --check
          python3 scripts/make-docs.py --check

      - name: Push the new picks
        id: push
        if: steps.fetch.outputs.skip != 'true'
        run: |
          git add docs/models/data.json docs/models/index.html docs/local-models/index.html
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Model picks: Artificial Analysis's numbers of $(date -u +%Y-%m-%d)"
          git push origin HEAD:main
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # A push made with the workflow's own token doesn't start a GitHub Pages build, so ask for one
      - name: Publish them
        if: steps.push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/$GITHUB_REPOSITORY/pages/builds" --silent
